# ============================================================
# 玄玑洞府 · Nginx 配置示例（文档 7.3）
# 请替换 server_name 与证书路径后使用
# ============================================================

server {
    listen 80;
    server_name xuanji.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xuanji.example.com;

    ssl_certificate     /etc/nginx/cert/cert.pem;
    ssl_certificate_key /etc/nginx/cert/cert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---------- 压缩（文档 8.2） ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 前端 3D 主页 ----------
    location / {
        root /var/www/xuanji-home;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 带哈希的静态资源长缓存
        location ~* \.(js|css|woff2?|ttf|otf|png|jpe?g|webp|gif|svg|glb|gltf|hdr)$ {
            root /var/www/xuanji-home;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ---------- 后台管理端 ----------
    location /admin {
        alias /var/www/xuanji-admin;
        index index.html;
        # 后台使用 HashRouter，理论上无需回退；此处仍保留回退以兼容直接访问子路径
        try_files $uri $uri/ /admin/index.html;

        location ~* \.(js|css|woff2?|ttf|otf|png|jpe?g|webp|gif|svg)$ {
            root /var/www/xuanji-admin;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ---------- 上传的图影 ----------
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }

    # ---------- API 反向代理 ----------
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }
}
