<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1419" />
    <meta name="description" content="玄玑洞府 · 以代码为器，以创意为丹，炼就数字乾坤。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>玄玑洞府</title>

    <!--
      字体：霞鹜文楷 / 思源宋体 / JetBrains Mono（CDN 不可达时自动回落到系统衬线体）
      说明：外链样式表会阻塞后续脚本执行，若字体 CDN 不可达，页面将一直等到超时。
      因此这里统一改为「异步样式表」（media=print + onload 切换），保证首屏不被字体拖住。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <style>
      /* 首屏关键样式内联，减少阻塞（文档 8.2） */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: #eef5ec;
        color: #16504a;
        font-family: '霞鹜文楷', 'LXGW WenKai', '思源宋体', 'Noto Serif SC', serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef5ec;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash span {
        letter-spacing: 0.6em;
        font-size: 20px;
        color: #8a6f32;
        animation: bootPulse 1.8s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash"><span>玄玑洞府</span></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
